name: Commit Gradle Wrapper Jar

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit-wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate gradle-wrapper.jar
        run: gradle wrapper --gradle-version 8.5 --distribution-type bin

      - name: Commit and push wrapper jar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f gradle/wrapper/gradle-wrapper.jar
          git commit -m "Add gradle-wrapper.jar" || echo "Nothing to commit"
          git push
